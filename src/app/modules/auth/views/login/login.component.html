<div class="login-container">
  <!-- Left Side: Illustration -->
  <div class="auth-visual">
    <div class="overlay"></div>
    <img src="/auth_illustration.png" alt="Auth Illustration" class="main-img">
    <div class="brand-info">
      <h1>Onevo</h1>
      <p>Next-Gen Tenant Management & Orchestration Platform</p>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="auth-form-container">
    <div class="form-card">
      <div class="form-header">
        <h2>Welcome Back</h2>
        <p>System Admin Portal Login</p>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="error-alert">
          <i class="bi bi-exclamation-circle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope"></i>
            <input type="email" formControlName="email" placeholder="admin@onevo.com">
          </div>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label>Password</label>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-wrapper">
            <i class="bi bi-lock"></i>
            <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
            <button type="button" class="toggle-btn" (click)="togglePassword()">
              <i [class]="showPassword() ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" [disabled]="loginForm.invalid || isLoading()">
          <span *ngIf="!isLoading()">Sign In</span>
          <div *ngIf="isLoading()" class="loader"></div>
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <button type="button" class="google-btn" (click)="loginWithGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
          Continue with Google
        </button>
      </form>

      <div class="form-footer">
        <p>Don't have an account? <span>Contact Super Admin</span></p>
      </div>
    </div>
  </div>
</div>
